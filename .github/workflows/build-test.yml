name: Build and test

# swift build and swift test (#39). Package.swift needs swift-tools-version 6.4 and
# macOS 27 (Xcode 27), so this uses the GitHub-hosted `xcode-27` image (macOS 27,
# Xcode 27.x; announced as a preview). The standard `macos-latest` / `macos-26`
# images do not carry Xcode 27 and cannot build the package. If `xcode-27` is
# unavailable or flaky, switch to a self-hosted macOS 27 runner, for example
# `[self-hosted, macOS, ARM64, m1max]` as the Creator repo uses.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
          echo "CPUs: $(sysctl -n hw.ncpu), active $(sysctl -n hw.activecpu)"

      - name: Build
        run: |
          set -o pipefail
          swift build --build-tests 2>&1 | tee build.log

      # Every target treats warnings as errors; this also fails on the warnings the compiler keeps
      # as warnings regardless, and on any not pinned in scripts/warning-allowlist.txt.
      - name: No warnings
        run: python3 scripts/check-warnings.py build.log

      # A hang fails after 10 minutes with the test process's thread stacks, in the log and the
      # test-stacks artifact, instead of running out the job's 45 with no output.
      - name: Test
        run: scripts/test-with-stacks.sh
        env:
          HANG_AFTER: 600
          STACKS_DIR: ${{ runner.temp }}/test-stacks

      - name: Keep the thread samples
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-stacks
          path: ${{ runner.temp }}/test-stacks
          if-no-files-found: ignore
